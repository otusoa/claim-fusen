info:
  name: List Claims - invalid Project UUID (400)
  type: http
  seq: 22

http:
  method: GET
  url: http://localhost:3000/api/claims?projectId=not-a-uuid
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("不正なqueryを400で拒否する", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody()).to.equal("Invalid input");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  projectIdの省略・空文字・不正UUID・複数指定が400になることを確認する。
