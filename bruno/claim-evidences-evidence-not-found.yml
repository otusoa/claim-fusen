  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "evidenceId": "d711468b-127f-486d-9a8b-bd7dd21e8db2",
        "type": "supports",
        "note": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("ステータス404を返す", function () {
          expect(res.getStatus()).to.equal(404);
