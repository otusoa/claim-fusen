info:
  name: Get Claim detail - not found (404)
  type: http
  seq: 20

http:
  method: GET
  url: http://localhost:3000/api/claims/d711468b-127f-486d-9a8b-bd7dd21e8db2
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("存在しないClaimを404で返す", function () {
          expect(res.getStatus()).to.equal(404);
          expect(res.getBody()).to.equal("Claim not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  UUID形式が正しくてもClaimが存在しなければ404になる。
  接続先DBに存在しないClaim IDを指定する。別のDBでは必要に応じてURLを更新する。
