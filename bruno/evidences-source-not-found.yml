info:
  name: Create Evidence - Source not found (404)
  type: http
  seq: 10

http:
  method: POST
  url: http://localhost:3000/api/evidences
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "projectId": "bf7b999a-6c43-455b-be79-2ceb05ccff89",
        "sourceId": "d711468b-127f-486d-9a8b-bd7dd21e8db2"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("ステータス404を返す", function () {
          expect(res.getStatus()).to.equal(404);
        });
        test("固定のエラーメッセージを返す", function () {
          expect(res.getBody()).to.equal("Source not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Sendで送信し、期待するステータスとTestsの成功を確認する。
  404の確認には、形式が正しくDBに存在しないUUIDを使う。
  Source不在の確認には、存在するProjectのIDを使う。

