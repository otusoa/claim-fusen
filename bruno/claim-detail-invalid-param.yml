info:
  name: Get Claim detail - invalid UUID (400)
  type: http
  seq: 19

http:
  method: GET
  url: http://localhost:3000/api/claims/not-a-uuid
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("不正なclaimIdを400で拒否する", function () {
          expect(res.getStatus()).to.equal(400);
          expect(res.getBody()).to.equal("Invalid input");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
